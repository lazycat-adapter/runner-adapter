params:
  - id: name
    type: string
    name: Runner Name
    description: The name of the Gitea runner
    optional: false
    default_value: gitea-runner
  - id: url
    type: string
    name: Gitea Instance URL
    description: The URL of the Gitea instance
    optional: false
    default_value: "http://gitea:3000/"
  - id: token
    type: string
    name: Gitea Registration Token
    description: The registration token for the Gitea runner
    optional: false
    default_value: your_registration_token_here
  - id: env
    type: string
    name: Runner Environment Variables
    description: "Additional environment variables for the runner (format: KEY=value, separated by commas)"
    optional: true
    default_value: ""
locales:
  zh:
    name:
      name: Runner 名称
      description: Gitea runner 的名称
    url: 
      name: Gitea 实例 URL
      description: Gitea 实例的 URL
    token:
      name: Gitea 注册令牌
      description: Gitea runner 的注册令牌
    env:
      name: Runner 环境变量
      description: "运行器的附加环境变量（格式：KEY=value，用逗号分隔）"
  en:
    name:
