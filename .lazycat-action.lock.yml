        - fix: align common behaviour with GitHub's runner (#1413)
        - fix: keep composite post steps in their own step scope (#1410)
        - docs: add a launchd example for macOS (#1408)
        - enhance: make shared tool cache safe at any capacity (#1401)
        - fix!: remove the dbfs log workaround and require Gitea 1.26.2 (#1395)
        - refactor!: remove the builtin actions (#1407)
        - chore(deps): update dependencies (#1406)
        - fix: stop a stalled docker daemon from hanging jobs and the e2e suite (#1404)
        - fix: re-detect the cache address per job and prefer IPv4 (#1398)
        - docs: trim comments and docs from workspace emptying change (#1403)
        - enhance: add ubuntu-26.04 to the default labels (#1396)
        - fix: empty root-owned bind workspaces for non-root runners (#1399)
        - docs: trust a private registry CA in the dind images (#1397)
        - enhance: improve hashFiles coercion and log grouping (#1394)
        - enhance: add builtin:download-artifact (#1344)
        - enhance: add builtin:upload-artifact (#1343)
        - refactor(container): stream copies into the job and archives out of the host (#1340)
        - feat: port the path patterns of @actions/glob (#1342)
        - fix: make container.sweep opt-in (#1389)
        - fix: prevent masking gaps in workflow command logs (#1384)
        - fix: upgrade Alpine packages in the runner images (#1388)
        - test: speed up (#1386)
        - test: fix windows path test (#1387)
        - enhance: trust a private CA with runner.ca_file and add container.volumes (#1366)
        - ci: sign release checksums with the imported GPG key (#1382)
        - test: fix TestRunExecListUsesJobEventAndAllPlans hang on macOS (#1378)
        - docs: use latest image tags in examples (#1383)
        - chore(deps): update go.yaml.in/yaml/v4 to v4.0.0 (#1381)
        - fix(cache): stop the cache server from running its volume out of space (#1377)
        - fix: align process handling and fix Windows crashes (#1376)
        - fix: give each Dockerfile action image its own ID (#1372)
        - fix: give git-lfs the checkout token once (#1371)
        - ci: run the Windows tests on a runner with KVM (#1369)
        - enhance: support Docker on FreeBSD and restructure the README (#1367)
        - enhance: test on Windows and fix what it found (#1348)
        - chore(deps): update dependencies (#1365)
        - fix(dind): double-fork in s6-notifyoncheck to eliminate zombie processes (#1364)
        - test(e2e): speed up and cover exec and Kubernetes modes (#1363)
        - enhance(kubernetes): fetch job pod copies from the runner over the pod network (#1354)
        - fix(exec): load local reusable workflows from disk with --no-skip-checkout (#1362)
        - enhance(cache): scope cache entries by ref like GitHub (#1361)
        - enhance: add GITEA_* aliases for built-in workflow environment variables (#1358)
        - fix: scope the action identity to the step executing an action (#1359)
